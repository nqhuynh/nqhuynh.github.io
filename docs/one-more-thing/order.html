<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lunch order | One More Thing</title><link rel="stylesheet" href="styles.css?v=plain-names-4cols"><script type="module" src="order.js?v=plain-names-4cols"></script></head>
<body><main><p><a href="./">One More Thing</a></p><h1>Lunch order</h1><p><a id="menu" target="_blank" rel="noopener">Gia Hoi Baguette menu</a> · Orders due 9 a.m. Friday.</p><p id="meeting-date"></p>
<form id="order-form" class="order-form"><label for="name">Your name</label><input id="name" name="name" autocomplete="name" maxlength="100" required><label for="items">Menu item(s) and quantity</label><textarea id="items" name="items" rows="3" maxlength="1500" required></textarea><label for="notes">Notes (optional)</label><input id="notes" name="notes" maxlength="500"><p class="small">This form prepares an email to nqh@ou.edu. It does not place a restaurant order.</p><button type="submit">Prepare order email</button></form>
<section id="order-result" hidden aria-live="polite"><h2>Your order email</h2><p><a id="email-link">Open email draft</a> · <a id="outlook-link" target="_blank" rel="noopener">Open in Outlook</a></p><p>Review and send the email, or copy the text below to nqh@ou.edu.</p><textarea id="order-text" rows="10" readonly aria-label="Order email text"></textarea></section>
<noscript><p>Please send your order to nqh@ou.edu.</p></noscript></main></body></html>
